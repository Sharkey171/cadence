<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<meta name="theme-color" content="#0e0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Cadence</span></div>
    <nav class="nav">
      <a href="#/home" data-nav="home" data-ic="home">Home</a>
      <a href="#/search" data-nav="search" data-ic="search">Search</a>
      <a href="#/library/songs" data-nav="library" data-ic="library">Library</a>
      <a href="#/liked" data-nav="liked" data-ic="heart">Liked songs</a>
    </nav>
    <div class="side-head"><span>Playlists</span>
      <button class="icon-btn" data-act="new-playlist" data-ic="plus" title="New playlist" aria-label="New playlist"></button>
    </div>
    <div id="side-playlists"></div>
    <div class="side-foot">
      <button class="btn primary" data-act="add-music" data-ic="plus">Add music</button>
      <a href="#/settings" data-nav="settings" data-ic="settings">Settings</a>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <label class="searchbox" data-ic="search"><input id="q" type="search" placeholder="Search songs, albums, artists" autocomplete="off"></label>
      <button class="icon-btn only-mobile" data-act="add-music" data-ic="plus" aria-label="Add music"></button>
      <a class="icon-btn only-mobile" href="#/settings" data-ic="settings" aria-label="Settings"></a>
    </header>
    <div id="banner" hidden></div>
    <div id="view"></div>
  </main>

  <footer id="player">
    <div id="mini-progress"><i></i></div>
    <div class="p-info">
      <div class="p-left" data-act="open-np">
        <div id="p-art" class="art"></div>
        <div class="p-meta"><div id="p-title">Nothing playing</div><div id="p-artist"></div></div>
      </div>
      <button class="icon-btn like cur-like" data-act="like-current" data-ic="heart" aria-label="Like"></button>
    </div>
    <div class="p-center">
      <div class="ctrls">
        <button class="icon-btn b-shuffle" data-act="shuffle" data-ic="shuffle" aria-label="Shuffle"></button>
        <button class="icon-btn" data-act="prev" data-ic="prev" aria-label="Previous"></button>
        <button class="pp" data-act="toggle" aria-label="Play or pause"></button>
        <button class="icon-btn" data-act="next" data-ic="next" aria-label="Next"></button>
        <button class="icon-btn b-repeat" data-act="repeat" data-ic="repeat" aria-label="Repeat"></button>
      </div>
      <div class="seekrow"><span class="t-cur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="t-dur">0:00</span></div>
    </div>
    <div class="p-right">
      <a class="icon-btn" href="#/queue" data-ic="queue" title="Queue" aria-label="Queue"></a>
      <span class="vol-ic" data-ic="volume"></span>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>
    <button class="pp mini-pp" data-act="toggle" aria-label="Play or pause"></button>
  </footer>

  <nav id="tabs">
    <a href="#/home" data-nav="home" data-ic="home"><span>Home</span></a>
    <a href="#/search" data-nav="search" data-ic="search"><span>Search</span></a>
    <a href="#/library/songs" data-nav="library" data-ic="library"><span>Library</span></a>
    <a href="#/playlists" data-nav="playlists" data-ic="list"><span>Playlists</span></a>
  </nav>
</div>

<section id="np" hidden>
  <div id="np-bg"></div>
  <header>
    <button class="icon-btn" data-act="close-np" data-ic="down" aria-label="Close"></button>
    <span>Now playing</span>
    <button class="icon-btn" data-act="np-menu" data-ic="dots" aria-label="More"></button>
  </header>
  <div id="np-art" class="art"></div>
  <div class="np-meta">
    <div class="np-text"><div id="np-title"></div><div id="np-artist"></div></div>
    <button class="icon-btn like cur-like" data-act="like-current" data-ic="heart" aria-label="Like"></button>
  </div>
  <div class="np-seek">
    <input class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span class="t-cur">0:00</span><span class="t-dur">0:00</span></div>
  </div>
  <div class="ctrls big">
    <button class="icon-btn b-shuffle" data-act="shuffle" data-ic="shuffle" aria-label="Shuffle"></button>
    <button class="icon-btn" data-act="prev" data-ic="prev" aria-label="Previous"></button>
    <button class="pp" data-act="toggle" aria-label="Play or pause"></button>
    <button class="icon-btn" data-act="next" data-ic="next" aria-label="Next"></button>
    <button class="icon-btn b-repeat" data-act="repeat" data-ic="repeat" aria-label="Repeat"></button>
  </div>
  <div class="np-foot"><a class="btn" href="#/queue" data-act="close-np" data-ic="queue">Queue</a></div>
</section>

<div id="backdrop" hidden></div>
<div id="menu" hidden></div>
<div id="toast"></div>

<dialog id="dlg">
  <form method="dialog">
    <h3></h3><p></p>
    <input type="text" maxlength="80">
    <div class="dlg-btns">
      <button value="ok" class="btn primary">OK</button>
      <button value="cancel" class="btn" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" multiple accept="audio/*,.mp3,.m4a,.m4b,.aac,.flac,.wav,.ogg,.oga,.opus,.weba" hidden>
<input type="file" id="dir-input" webkitdirectory multiple hidden>
<audio id="audio" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
