<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seylumi launch preview</title>
<style>
  :root { --bg: #0e0e12; --text: #f3f1ee; --muted: #a09ea8; --a1: #ff7a59; --a2: #d9467a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---------- the launch screen ---------- */
  #launch { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--bg); }
  #launch.out { animation: out .35s ease-in forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.04); } }

  .stage { position: relative; width: 240px; height: 278px; }
  .icon { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 24px; background: linear-gradient(135deg, var(--a1), var(--a2)); display: flex; align-items: center; justify-content: center;
    animation: iconIn .45s cubic-bezier(.2,1.4,.4,1) both, iconAway .35s ease-in .55s forwards; }
  .icon i { display: inline-block; width: 7px; margin: 0 3px; border-radius: 4px; background: #fff; animation: eq .5s ease-in-out infinite alternate; }
  .icon i:nth-child(1) { height: 18px; } .icon i:nth-child(2) { height: 40px; animation-delay: -.2s; } .icon i:nth-child(3) { height: 54px; animation-delay: -.35s; } .icon i:nth-child(4) { height: 30px; animation-delay: -.1s; } .icon i:nth-child(5) { height: 16px; animation-delay: -.3s; }
  @keyframes eq { to { transform: scaleY(.45); } }
  @keyframes iconIn { from { transform: scale(.4); opacity: 0; } }
  @keyframes iconAway { to { transform: translateY(-30px) scale(.3); opacity: 0; } }

  .dancer { position: absolute; inset: 0; opacity: 0; animation: dancerIn .4s ease-out .6s forwards; }
  @keyframes dancerIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  .dancer svg { width: 100%; height: 100%; overflow: visible; }
  .bounce { animation: bounce .5s ease-in-out infinite; transform-origin: 95px 190px; }
  @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-9px) rotate(4deg); } }
  .head { animation: bob .5s ease-in-out infinite; transform-origin: 95px 92px; }
  @keyframes bob { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }
  .armL { animation: armL .5s ease-in-out infinite; transform-origin: 74px 108px; }
  .armR { animation: armR .5s ease-in-out infinite; transform-origin: 116px 108px; }
  @keyframes armL { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(-110deg); } }
  @keyframes armR { 0%, 100% { transform: rotate(110deg); } 50% { transform: rotate(-20deg); } }
  .legL { animation: legL .5s ease-in-out infinite; transform-origin: 85px 150px; }
  .legR { animation: legR .5s ease-in-out infinite; transform-origin: 105px 150px; }
  @keyframes legL { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-4deg); } }
  @keyframes legR { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-14deg); } }
  .shadow { animation: shadow .5s ease-in-out infinite; transform-origin: 95px 200px; }
  @keyframes shadow { 50% { transform: scaleX(.8); opacity: .5; } }

  .note { position: absolute; font-size: 22px; color: var(--a1); opacity: 0; animation: note 1.6s ease-out infinite; }
  .note.n1 { left: 18px; top: 70px; animation-delay: .8s; } .note.n2 { right: 14px; top: 50px; animation-delay: 1.2s; color: var(--a2); } .note.n3 { right: 34px; top: 110px; animation-delay: 1.6s; font-size: 17px; }
  @keyframes note { 0% { opacity: 0; transform: translateY(10px) rotate(-10deg); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-50px) rotate(15deg); } }

  .word { font-size: 40px; font-weight: 800; letter-spacing: -1px; opacity: 0; animation: up .45s ease-out .85s forwards; }
  .word b { background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .slogan { font-size: 18px; color: var(--muted); opacity: 0; animation: up .45s ease-out 1.1s forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .skip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); opacity: .6; }

  /* ---------- moonwalk: faces right, glides backwards (left) while the feet seem to walk forwards ---------- */
  .mw .bounce { animation: glide 1.8s linear infinite; transform-origin: 95px 190px; }
  @keyframes glide { from { transform: translateX(55px) rotate(-5deg); } to { transform: translateX(-55px) rotate(-5deg); } }
  .mw .face { transform: translateX(7px); }
  .mw .head { animation: nod .4s ease-in-out infinite; }
  @keyframes nod { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-3deg) translateY(2px); } }
  .mw .armL { animation: mwArmL .8s ease-in-out infinite alternate; }
  .mw .armR { animation: mwArmR .8s ease-in-out infinite alternate; }
  @keyframes mwArmL { from { transform: rotate(-38deg); } to { transform: rotate(-58deg); } }
  @keyframes mwArmR { from { transform: rotate(58deg); } to { transform: rotate(38deg); } }
  /* each leg: slides back flat on the floor, then lifts its heel (knee bent) and swaps */
  .mw .legL, .mw .legR { animation: mwLeg .8s linear infinite; }
  .mw .legR { animation-delay: -.4s; }
  @keyframes mwLeg { 0% { transform: rotate(-12deg) scaleY(1); } 48% { transform: rotate(14deg) scaleY(1); } 52% { transform: rotate(14deg) scaleY(.88); } 100% { transform: rotate(-12deg) scaleY(.88); } }
  .mw .foot { transform-box: fill-box; transform-origin: 85% 60%; animation: mwFoot .8s linear infinite; translate: 6px 0; }
  .mw .legL { translate: 5px 0; } .mw .legR { translate: -5px 0; }
  .mw .legR .foot { animation-delay: -.4s; }
  @keyframes mwFoot { 0%, 48% { transform: rotate(0); } 52%, 100% { transform: rotate(-28deg); } }
  .mw .shadow { animation: glideShadow 1.8s linear infinite; }
  @keyframes glideShadow { from { transform: translateX(55px); } to { transform: translateX(-55px); } }
  .mw .note.n1 { left: auto; right: 10px; }

  /* people who switch off motion in their phone settings: no dancing, just a gentle fade */
  .calm .icon, .calm .icon i, .calm .bounce, .calm .foot, .calm .face, .calm .head, .calm .armL, .calm .armR, .calm .legL, .calm .legR, .calm .shadow, .calm .note { animation: none !important; }
  .calm .icon { opacity: 0; } .calm .note { display: none; }
  .calm .dancer, .calm .word, .calm .slogan { animation: fade .5s ease-out forwards !important; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- preview controls (not part of the real launch screen) ---------- */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #17171cee; border-top: 1px solid #2a2a35; z-index: 5; }
  #controls button { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 999px; border: 1px solid #3a3a46; background: #22222b; color: var(--text); cursor: pointer; }
  #controls button.on { background: var(--a1); border-color: var(--a1); color: #1a0e0a; font-weight: 700; }
  #controls p { width: 100%; margin: 0 0 2px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="launch"></div>

<div id="controls">
  <p>Preview only. In the app it plays once while Seylumi loads (about 1.5 s), then fades into the app. Tap the animation to skip.</p>
  <button id="replay" class="on">▶ Replay</button>
  <button id="loop">Loop: off</button>
  <button id="dance" class="on">Dance: moonwalk</button>
  <button id="lang">Gaeilge</button>
  <button id="calm">Reduced motion: off</button>
</div>

<template id="tpl">
  <div class="stage">
    <div class="icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="dancer" aria-hidden="true">
      <svg viewBox="0 0 190 220">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#d9467a"/></linearGradient>
        </defs>
        <ellipse class="shadow" cx="95" cy="203" rx="34" ry="6" fill="#000" opacity=".45"/>
        <g class="bounce">
          <!-- legs -->
          <g class="legL"><path d="M85 150 L78 196" stroke="#2f2f3c" stroke-width="13" stroke-linecap="round"/><ellipse class="foot" cx="74" cy="198" rx="11" ry="6" fill="#f3f1ee"/></g>
          <g class="legR"><path d="M105 150 L112 196" stroke="#2f2f3c" stroke-width="13" stroke-linecap="round"/><ellipse class="foot" cx="116" cy="198" rx="11" ry="6" fill="#f3f1ee"/></g>
          <!-- arms -->
          <g class="armL"><path d="M74 108 L52 128" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/><circle cx="50" cy="130" r="7" fill="#f3f1ee"/></g>
          <g class="armR"><path d="M116 108 L138 128" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/><circle cx="140" cy="130" r="7" fill="#f3f1ee"/></g>
          <!-- body -->
          <rect x="70" y="98" width="50" height="60" rx="22" fill="url(#g)"/>
          <path d="M84 118 v18 M95 112 v30 M106 120 v14" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
          <!-- head with headphones -->
          <g class="head">
            <circle cx="95" cy="66" r="28" fill="#f3f1ee"/>
            <g class="face"><path d="M84 64 q4 -5 8 0 M98 64 q4 -5 8 0" stroke="#2f2f3c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M86 75 q9 9 18 0" stroke="#2f2f3c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <circle cx="80" cy="74" r="4" fill="#ff7a59" opacity=".35"/><circle cx="110" cy="74" r="4" fill="#ff7a59" opacity=".35"/></g>
            <path d="M64 66 a31 33 0 0 1 62 0" stroke="#2f2f3c" stroke-width="7" fill="none" stroke-linecap="round"/>
            <rect x="58" y="58" width="14" height="22" rx="6" fill="url(#g)"/>
            <rect x="118" y="58" width="14" height="22" rx="6" fill="url(#g)"/>
          </g>
        </g>
      </svg>
    </div>
    <span class="note n1">♪</span><span class="note n2">♫</span><span class="note n3">♪</span>
  </div>
  <div class="word"><b>Seylumi</b></div>
  <div class="slogan"></div>
  <div class="skip"></div>
</template>

<script>
  const SLOGAN = { en: ['Your music, your way', 'Tap to skip'], ga: ['Do cheol, do bhealach', 'Tapáil chun scipeáil'] };
  let lang = 'en', loop = false, dance = 'mw', calm = matchMedia('(prefers-reduced-motion: reduce)').matches, timer;
  const L = document.getElementById('launch');
  function play() {
    clearTimeout(timer);
    L.className = calm ? 'calm' : dance; L.innerHTML = document.getElementById('tpl').innerHTML;
    L.querySelector('.slogan').textContent = SLOGAN[lang][0]; L.querySelector('.skip').textContent = SLOGAN[lang][1];
    // in the app the screen fades out once Seylumi is ready (here: after 2.6 s so the whole thing can be seen)
    timer = setTimeout(finish, 2600);
  }
  function finish() { clearTimeout(timer); L.classList.add('out'); timer = setTimeout(() => { L.innerHTML = ''; L.className = ''; if (loop) timer = setTimeout(play, 600); }, 400); }
  L.addEventListener('click', () => { if (L.innerHTML) finish(); });
  const btn = id => document.getElementById(id);
  btn('replay').onclick = play;
  btn('loop').onclick = () => { loop = !loop; btn('loop').textContent = 'Loop: ' + (loop ? 'on' : 'off'); btn('loop').classList.toggle('on', loop); if (loop && !L.innerHTML) play(); };
  btn('dance').onclick = () => { dance = dance === 'mw' ? '' : 'mw'; btn('dance').textContent = 'Dance: ' + (dance ? 'moonwalk' : 'groove'); play(); };
  btn('lang').onclick = () => { lang = lang === 'en' ? 'ga' : 'en'; btn('lang').textContent = lang === 'en' ? 'Gaeilge' : 'English'; play(); };
  btn('calm').onclick = () => { calm = !calm; btn('calm').textContent = 'Reduced motion: ' + (calm ? 'on' : 'off'); btn('calm').classList.toggle('on', calm); play(); };
  btn('calm').textContent = 'Reduced motion: ' + (calm ? 'on' : 'off'); btn('calm').classList.toggle('on', calm);
  play();
</script>
</body>
</html>
